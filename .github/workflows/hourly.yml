name: Hourly harvest

on:
  schedule:
    - cron: '0 * * * *'    # top of every hour UTC
  workflow_dispatch:
    inputs:
      redact:
        description: 'Redact vendor contact details from published bundle'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Install Playwright
        run: |
          npm install playwright --no-save
          npx playwright install --with-deps chromium

      - name: Harvest all states + export
        run: node src/ci-run.js ${{ (github.event_name == 'workflow_dispatch' && inputs.redact == false) && '' || '--redact' }}

      - name: Commit data store
        run: |
          git config user.name  "harvest-bot"
          git config user.email "harvest-bot@users.noreply.github.com"
          git add -f data/store
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "Harvest $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: dist/
          retention-days: 7

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: harvest
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
